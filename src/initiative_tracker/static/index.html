<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5.5e Initiative Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v={{ app_version }}">
</head>
<body>
  <main class="page-shell">
    <section class="tracker-card">
      <header class="tracker-header">
        <div>
          <p class="eyebrow">DUNGEONS AND DRAGONS 5.5e</p>
          <h1>Initiative Tracker <span class="app-version">v{{ app_version }}</span></h1>
        </div>
        <div class="actions" role="group" aria-label="Table actions">
          <button id="sort-btn" type="button">Sort by Initiative</button>
          <button id="add-row-btn" type="button">Add Row</button>
          <div class="clear-actions">
            <button id="clear-btn" type="button" class="danger">Clear Table</button>
            <button
              id="clear-menu-btn"
              type="button"
              class="danger clear-menu-toggle"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="clear-menu"
              aria-label="Clear table options"
            >
              ▾
            </button>
            <div id="clear-menu" class="clear-menu hidden" aria-label="Clear table options">
              <button type="button" class="clear-menu-item" data-clear-mode="all">Clear All Rows (NPC + PC)</button>
              <button type="button" class="clear-menu-item" data-clear-mode="pcs">Clear PC Rows</button>
            </div>
          </div>
        </div>
      </header>

      <div class="table-wrap">
        <table aria-label="Combatant initiative table">
          <thead>
            <tr>
              <th scope="col" aria-label="Persistence toggle"></th>
              <th scope="col">Initiative</th>
              <th scope="col">Name</th>
              <th scope="col">HP</th>
              <th scope="col">AC</th>
              <th scope="col">Conditions</th>
            </tr>
          </thead>
          <tbody id="combatant-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <template id="row-template">
    <tr data-combatant-type="npc">
      <td>
        <button class="type-toggle-btn" type="button" data-type-toggle aria-pressed="false" aria-label="Mark as player character" data-tooltip="NPC: this row is removed by Clear Table. Click to keep it."></button>
      </td>
      <td>
        <div class="initiative-cell">
          <input class="initiative-input" type="number" inputmode="numeric" min="0" placeholder="0" aria-label="Initiative">
          <button class="roll-btn" type="button" aria-label="Roll d20">d20</button>
        </div>
      </td>
      <td class="name-cell"><input class="name-input" type="text" placeholder="Combatant name" aria-label="Name" autocomplete="off" spellcheck="false"></td>
      <td><input class="hp-input" type="number" inputmode="numeric" min="0" placeholder="HP" aria-label="HP"></td>
      <td><input class="ac-input" type="number" inputmode="numeric" min="0" placeholder="AC" aria-label="AC"></td>
      <td><input type="text" placeholder="Blinded, Prone, Poisoned, Incapacitated, etc." aria-label="Conditions"></td>
    </tr>
  </template>

  <script src="/static/js/main.js?v={{ app_version }}" type="module"></script>
</body>
</html>
